name: discord-notify

on:
  workflow_call:
    inputs:
      # 선택 입력으로 두는 이유는 SonarQube를 아직 사용하지 않는 다른 MSA 저장소도 기존 방식으로 Webhook을 호출할 수 있게 하기 위함
      quality_result:
        required: false
        type: string
        default: not_configured

      coverage_percentage:
        required: false
        type: string
        default: not_available

      coverage_threshold:
        required: false
        type: string
        default: not_available

      coverage_result:
        required: false
        type: string
        default: not_configured

      sonar_url:
        required: false
        type: string
        default: not_available

      service_name:
        required: true
        type: string
      build_result:
        required: true
        type: string
      deploy_result:
        required: true
        type: string
      repository:
        required: true
        type: string
      branch:
        required: true
        type: string
      commit_sha:
        required: true
        type: string
      commit_message:
        required: true
        type: string
      actor:
        required: true
        type: string
      workflow_url:
        required: true
        type: string

    secrets:
      DISCORD_WEBHOOK_URL:
        required: true

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord
        env:
          SERVICE_NAME: ${{ inputs.service_name }}
          COVERAGE_RESULT: ${{ inputs.coverage_result }}
          COVERAGE_THRESHOLD: ${{ inputs.coverage_threshold }}
          QUALITY_RESULT: ${{ inputs.quality_result }}
          COVERAGE_PERCENTAGE: ${{ inputs.coverage_percentage }}
          SONAR_URL: ${{ inputs.sonar_url }}
          BUILD_RESULT: ${{ inputs.build_result }}
          DEPLOY_RESULT: ${{ inputs.deploy_result }}
          REPOSITORY: ${{ inputs.repository }}
          BRANCH: ${{ inputs.branch }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
          ACTOR: ${{ inputs.actor }}
          WORKFLOW_URL: ${{ inputs.workflow_url }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ "$COVERAGE_RESULT" = "failure" ]; then
            TITLE="${SERVICE_NAME} Coverage Check Failed"
            CONTENT="❌ ${SERVICE_NAME} 테스트 커버리지 미달"
            if [ "$COVERAGE_THRESHOLD" != "not_available" ]; then
              DESCRIPTION="JaCoCo 라인 커버리지가 프로젝트 기준인 ${COVERAGE_THRESHOLD}%를 충족하지 못했습니다."
            else
              DESCRIPTION="JaCoCo 라인 커버리지가 프로젝트 기준을 충족하지 못했습니다."
            fi
            COLOR="15548997"
          elif [ "$QUALITY_RESULT" = "failure" ]; then
            TITLE="${SERVICE_NAME} Quality Check Failed"
            CONTENT="❌ ${SERVICE_NAME} 품질 검사 실패"
            DESCRIPTION="테스트 또는 SonarQube Quality Gate를 통과하지 못했습니다."
            COLOR="15548997"
          elif [ "$BUILD_RESULT" = "failure" ]; then
            TITLE="${SERVICE_NAME} Image Build Failed"
            CONTENT="❌ ${SERVICE_NAME} 이미지 빌드 실패"
            DESCRIPTION="컨테이너 이미지 빌드 또는 GHCR push 단계에서 실패했습니다."
            COLOR="15548997"
          elif [ "$DEPLOY_RESULT" = "failure" ]; then
            TITLE="${SERVICE_NAME} Kubernetes Deploy Failed"
            CONTENT="❌ ${SERVICE_NAME} 배포 실패"
            DESCRIPTION="서버 SSH, kubectl apply, rollout 또는 rollback 단계에서 실패했습니다."
            COLOR="15548997"
          elif [ "$COVERAGE_RESULT" = "cancelled" ] || [ "$BUILD_RESULT" = "cancelled" ] || [ "$DEPLOY_RESULT" = "cancelled" ]; then
            TITLE="${SERVICE_NAME} CI/CD Cancelled"
            CONTENT="⚠️ ${SERVICE_NAME} 실행 취소"
            DESCRIPTION="품질 검사, 빌드 또는 배포 job이 취소되었습니다."
            COLOR="16776960"
          elif [ "$COVERAGE_RESULT" = "skipped" ] || [ "$BUILD_RESULT" = "skipped" ] || [ "$DEPLOY_RESULT" = "skipped" ]; then
            TITLE="${SERVICE_NAME} CI/CD Skipped"
            CONTENT="⚠️ ${SERVICE_NAME} 실행 스킵"
            DESCRIPTION="품질 검사, 빌드 또는 배포 job이 실행되지 않았습니다."
            COLOR="16776960"
          elif { [ "$QUALITY_RESULT" = "success" ] || [ "$QUALITY_RESULT" = "not_configured" ]; } \
            && { [ "$COVERAGE_RESULT" = "success" ] || [ "$COVERAGE_RESULT" = "not_configured" ]; } \
            && [ "$BUILD_RESULT" = "success" ] \
            && [ "$DEPLOY_RESULT" = "success" ]; then
            
            TITLE="${SERVICE_NAME} Kubernetes Deploy Success"
            CONTENT="✅ ${SERVICE_NAME} 배포 성공"
            DESCRIPTION="${SERVICE_NAME} rollout이 완료되었습니다."
            COLOR="5763719"
          else
            TITLE="${SERVICE_NAME} CI/CD Unknown"
            CONTENT="⚠️ ${SERVICE_NAME} 상태 확인 필요"
            DESCRIPTION="예상하지 못한 job 상태가 전달되었습니다."
            COLOR="16776960"
          fi
          
          if [ "$COVERAGE_PERCENTAGE" != "not_available" ]; then
            if [ "$COVERAGE_THRESHOLD" != "not_available" ]; then
              COVERAGE_DISPLAY="${COVERAGE_RESULT} (${COVERAGE_PERCENTAGE}% / ${COVERAGE_THRESHOLD}%)"
            else
              COVERAGE_DISPLAY="${COVERAGE_RESULT} (${COVERAGE_PERCENTAGE}%)"
            fi
          else
            COVERAGE_DISPLAY="$COVERAGE_RESULT"
          fi
          
          if [ -n "$SONAR_URL" ] \
            && [ "$SONAR_URL" != "not_available" ]; then
            SONAR_DISPLAY="[상세 분석 열기](${SONAR_URL})"
          else
            SONAR_DISPLAY="not_available"
          fi

          COMMIT_SHORT=$(echo "$COMMIT_SHA" | cut -c1-7)
          COMMIT_MESSAGE_TRUNCATED="${COMMIT_MESSAGE:0:1024}"

          jq -n \
            --arg content "$CONTENT" \
            --arg title "$TITLE" \
            --arg description "$DESCRIPTION" \
            --arg service "$SERVICE_NAME" \
            --arg repository "$REPOSITORY" \
            --arg branch "$BRANCH" \
            --arg commit "$COMMIT_SHORT" \
            --arg commitMessage "$COMMIT_MESSAGE_TRUNCATED" \
            --arg actor "$ACTOR" \
            --arg workflow "$WORKFLOW_URL" \
            --arg coverageResult "$COVERAGE_RESULT" \
            --arg qualityResult "$QUALITY_RESULT" \
            --arg coverageDisplay "$COVERAGE_DISPLAY" \
            --arg sonarDisplay "$SONAR_DISPLAY" \
            --arg buildResult "$BUILD_RESULT" \
            --arg deployResult "$DEPLOY_RESULT" \
            --argjson color "$COLOR" \
            '{
              content: $content,
              embeds: [
                {
                  title: $title,
                  description: $description,
                  color: $color,
                  fields: [
                    { name: "Service", value: $service, inline: true },
                    { name: "Repository", value: $repository, inline: true },
                    { name: "Branch", value: $branch, inline: true },
                    { name: "Commit", value: $commit, inline: true },
                    { name: "Commit Message", value: $commitMessage, inline: false },
                    { name: "Actor", value: $actor, inline: true },
                    { name: "Quality", value: $qualityResult, inline: true },
                    { name: "Coverage", value: $coverageDisplay, inline: true },
                    { name: "Build", value: $buildResult, inline: true },
                    { name: "Deploy", value: $deployResult, inline: true },
                    { name: "SonarQube", value: $sonarDisplay, inline: false },
                    { name: "Workflow", value: $workflow, inline: false }
                  ]
                }
              ]
            }' > discord-payload.json

          curl --fail --show-error --silent \
            --connect-timeout 5 \
            --max-time 15 \
            --retry 2 \
            --retry-delay 2 \
            -H "Content-Type: application/json" \
            -d @discord-payload.json \
            "$DISCORD_WEBHOOK_URL" || echo "::warning::Discord notification failed. Build/deploy result is not changed by notification failure."
